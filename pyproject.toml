[project]
name = "home-manager"
version = "0.1.0"
description = "Morning summary of two Google Calendars, with conflicts"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
