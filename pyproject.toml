[project]
name = "home-manager"
version = "0.2.0"
description = "Household helper: Apple Calendar and Reminders for the family hub, with a morning digest"
requires-python = ">=3.12"
dependencies = [
    # EventKit bindings for Apple Calendar and Reminders. macOS only; tests use a fake.
    "pyobjc-framework-EventKit>=11; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
