# Copy to ~/.config/home-manager/config.toml and fill in.
# This example is committed; the real file lives outside the repo because it
# holds phone numbers. Every setting is optional.

# IANA time zone for "today" and displayed times. Defaults to the Mac's own.
timezone = "America/New_York"

[household]
# The shared iCloud calendar the hub adds to and changes. It's the only one it changes.
calendar = "Household"

[calendars]
# Calendars to read for summaries and clash checks, by name as Calendar shows
# them. Leave out to read every calendar except subscribed ones and Birthdays.
# read = ["Household", "Nick", "Sarah"]

[calendars.labels]
# Friendlier names in summaries: "calendar name" = "label".
# "Home" = "Nick"

[bills]
# Reminders list with bills, and how many days ahead the digest lists them.
list = "Bills"
remind_days = 3

[digest]
# Who gets the morning digest by iMessage (phone numbers with +country code,
# or Apple Account emails), and when.
to = ["+15551234567", "+15557654321"]
time = "07:00"

[jobs]
# Job matches from `hm jobs loop`, texted to one person only (never the group
# chat): the one job hunting. Leave out to keep matches in the queue untexted.
# to = "+15551234567"
# Text jobs that score at least this (1-10). The rest go in the weekly check.
min_fit = 7
# No job texts between these times; overnight matches go out after quiet_end.
quiet_start = "21:00"
quiet_end = "08:00"
# The weekly grading check: every job that scored below min_fit that week.
weekly_day = "sunday"
weekly_time = "09:00"
